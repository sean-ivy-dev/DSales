name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: dsales

jobs:
  # 1) 테스트 (Testcontainers — GitHub 러너에 Docker 있음)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ★Gradle 의존성·빌드 캐시. 없으면 매 배포마다 의존성 전부를 새로 받는다.
      #   (캐시는 main 에서만 저장되고 다른 브랜치는 읽기만 한다 — 액션 기본값)
      - uses: gradle/actions/setup-gradle@v4
      - name: 테스트
        run: chmod +x gradlew && ./gradlew test

      # 정적분석(P0-07 / 검수 S-7 "정적분석 SQLi 0건").
      # 지적이 하나라도 남으면 실패한다 — config/spotbugs-exclude.xml 에 사유를 적어 제외하거나 고칠 것.
      - name: 정적분석 (SpotBugs + FindSecBugs)
        run: ./gradlew spotbugsMain

      - name: 정적분석 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/
          if-no-files-found: ignore

      # ★jar 는 여기서 한 번만 만든다. 예전엔 Docker 빌드 안에서 캐시 없이
      #   의존성 다운로드+컴파일을 처음부터 다시 했다(같은 일을 두 번).
      - name: 실행 jar 빌드
        run: ./gradlew bootJar && cp build/libs/*-SNAPSHOT.jar build/libs/app.jar

      - name: 실행 jar 전달
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/app.jar
          retention-days: 1

  # 2) 이미지 빌드 → ECR push → EC2 배포
  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 실행 jar 받기(test 잡에서 빌드한 것)
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: AWS 자격증명
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 & push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: ECR 임시 로그인 토큰 발급(EC2 전달용)
        id: token
        run: echo "pw=$(aws ecr get-login-password --region $AWS_REGION)" >> "$GITHUB_OUTPUT"

      - name: EC2 배포 (SSH) — DB 자격증명은 Secrets Manager에서 앱이 직접 조회
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          # ‼️appleboy/ssh-action은 **여기 나열된 것만** 원격 셸로 넘긴다.
          #   step의 env: 에만 적으면 러너에서만 살아 있고 원격에서는 빈 값이 된다 —
          #   docker run -e VAR="" 로 들어가 앱은 기본값으로 조용히 뜬다(2026-09-08에 이걸로 한 번 헤맸다).
          #   env: 에 값을 추가하면 이 줄에도 반드시 같이 추가할 것.
          envs: REGISTRY,ECR_PW,DB_HOST,DB_SECRET_ID,REDIS_HOST,JWT_SECRET,AWS_REGION,COOKIE_SECURE,COOKIE_SAME_SITE,DSRE_ENABLED,DSRE_URL,DSRE_USERNAME,DSRE_PASSWORD,MAIL_ENABLED,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,MAIL_FROM,MAIL_SSL,MAIL_STARTTLS,MAIL_SSL_TRUST,DEALER_SITE_API_KEY,DEALER_SITE_WAREHOUSE_CODE
          # ★DB 계정/비번을 -e 로 넣지 않는다. 넣으면 환경변수가 application-aws.yml 보다 우선순위가 높아
          #   Secrets Manager 조회를 무력화한다(=로테이션 장애 재발). DB_HOST/DB_SECRET_ID 만 전달.
          script: |
            set -e
            # 필수 시크릿 선검사 — 비어 있으면 컨테이너를 띄우지 않고 즉시 실패한다.
            # 빈 값으로 띄우면 접속 URL이 'secretsManagerSecretId=' 로 만들어져 앱이 기동 중 죽고,
            # 그때는 health 폴링 5분을 다 태운 뒤에야 원인을 알 수 있다(2026-08-04 배포 실패).
            missing=""
            [ -n "$DB_HOST" ]      || missing="$missing DB_HOST"
            [ -n "$DB_SECRET_ID" ] || missing="$missing DB_SECRET_ID"
            [ -n "$REDIS_HOST" ]   || missing="$missing REDIS_HOST"
            [ -n "$JWT_SECRET" ]   || missing="$missing JWT_SECRET"
            if [ -n "$missing" ]; then
              echo "!! GitHub Secret 미설정:$missing"
              echo "   저장소 Settings → Secrets and variables → Actions 에서 등록할 것."
              echo "   DB_SECRET_ID = RDS 관리형 시크릿 이름 또는 ARN (예: rds!db-xxxxxxxx)"
              exit 1
            fi
            echo "$ECR_PW" | docker login --username AWS --password-stdin "$REGISTRY"
            docker pull "$REGISTRY/dsales:latest"
            docker stop dsales || true
            docker rm dsales || true
            # 앱과 DSRE2 복제본을 같은 사용자 네트워크에 둔다.
            # 앱이 컨테이너라 localhost:3307 로는 호스트의 DB에 닿지 못한다 —
            # 사용자 네트워크에 묶으면 컨테이너 이름(dsre-mariadb)이 그대로 DNS가 된다.
            # ★로그 드라이버를 json-file 로 둔다(awslogs 아님).
            #   awslogs 는 도커에 로그를 남기지 않아 `docker logs` 도, Dozzle 같은 뷰어도 아무것도 못 본다.
            #   개발서버는 로그를 계속 들여다봐야 해서 로컬 보관 + 뷰어 쪽을 택했다.
            #   ⚠️대가: CloudWatch 에 쌓이지 않고, 컨테이너를 지우면 그 로그도 함께 사라진다.
            #     max-size/max-file 로 로테이션을 걸어 디스크가 차는 것만 막는다(최대 150MB).
            docker network create dsales-net 2>/dev/null || true
            docker network connect dsales-net dsre-mariadb 2>/dev/null || true
            docker run -d --name dsales --restart unless-stopped -p 8080:8080 \
              --network dsales-net \
              --log-driver=json-file \
              --log-opt max-size=50m \
              --log-opt max-file=3 \
              -e SPRING_PROFILES_ACTIVE=aws \
              -e AWS_REGION="$AWS_REGION" \
              -e DB_HOST="$DB_HOST" \
              -e DB_SECRET_ID="$DB_SECRET_ID" \
              -e SPRING_DATA_REDIS_HOST="$REDIS_HOST" \
              -e SPRING_DATA_REDIS_PORT=6379 \
              -e DAESUNG_SECURITY_JWTSECRET="$JWT_SECRET" \
              -e DAESUNG_SECURITY_COOKIESECURE="$COOKIE_SECURE" \
              -e DAESUNG_SECURITY_COOKIESAMESITE="$COOKIE_SAME_SITE" \
              -e DAESUNG_DSRE_ENABLED="$DSRE_ENABLED" \
              -e DAESUNG_DSRE_URL="$DSRE_URL" \
              -e DAESUNG_DSRE_USERNAME="$DSRE_USERNAME" \
              -e DAESUNG_DSRE_PASSWORD="$DSRE_PASSWORD" \
              -e MAIL_ENABLED="$MAIL_ENABLED" \
              -e MAIL_HOST="$MAIL_HOST" \
              -e MAIL_PORT="$MAIL_PORT" \
              -e MAIL_USERNAME="$MAIL_USERNAME" \
              -e MAIL_PASSWORD="$MAIL_PASSWORD" \
              -e MAIL_FROM="$MAIL_FROM" \
              -e MAIL_SSL="$MAIL_SSL" \
              -e MAIL_STARTTLS="$MAIL_STARTTLS" \
              -e MAIL_SSL_TRUST="$MAIL_SSL_TRUST" \
              -e DEALER_SITE_API_KEY="$DEALER_SITE_API_KEY" \
              -e DEALER_SITE_WAREHOUSE_CODE="$DEALER_SITE_WAREHOUSE_CODE" \
              "$REGISTRY/dsales:latest"
            docker image prune -f
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_PW: ${{ steps.token.outputs.pw }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_SECRET_ID: ${{ secrets.DB_SECRET_ID }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # ★프론트(Amplify)와 API 도메인이 다르므로 refresh 쿠키는 SameSite=None 이어야 한다.
          #   Strict/Lax면 브라우저가 쿠키를 안 보내 30분 뒤 재발급이 실패한다(조용히 로그아웃).
          #   None 은 Secure 필수 → API에 https(Caddy 등)가 붙은 뒤에만 켠다.
          #   ‼️둘이 어긋나면 앱이 기동을 거부한다(JwtProperties.assertCookiePolicy) — 반쯤 적용된 배포 방지.
          #   https 전에는 아래 두 줄을 각각 false / Strict 로 둘 것.
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE || 'false' }}
          COOKIE_SAME_SITE: ${{ vars.COOKIE_SAME_SITE || 'Strict' }}
          # DSRE2 복제본(같은 EC2의 dsre-mariadb 컨테이너). 기본 off — 변수로 켠다.
          # ⚠️호스트명은 컨테이너 이름이다(localhost 아님). 포트도 컨테이너 내부 3306이다.
          DSRE_ENABLED: ${{ vars.DSRE_ENABLED || 'false' }}
          DSRE_URL: ${{ vars.DSRE_URL || 'jdbc:mysql://dsre-mariadb:3306/dsre2?characterEncoding=UTF-8&useUnicode=true' }}
          DSRE_USERNAME: ${{ vars.DSRE_USERNAME || 'dsre' }}
          DSRE_PASSWORD: ${{ secrets.DSRE_PASSWORD || 'dsre' }}
          # 메일 발송(9/27 항목 17·A-4). ‼️계정·비밀번호는 **시크릿으로만** 넣는다 —
          # 레거시는 .vb 에 하드코딩돼 있었고 소스를 받은 사람 누구나 회사 메일로 보낼 수 있었다.
          # 값이 없으면 MAIL_ENABLED 가 false 라 발송 기능이 꺼진 채로 뜬다(조용한 실패가 아니라 400).
          MAIL_ENABLED: ${{ vars.MAIL_ENABLED || 'false' }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT || '465' }}
          MAIL_SSL: ${{ vars.MAIL_SSL || 'true' }}
          # ‼️레거시(.NET SmtpClient)는 465에 EnableSsl=true 를 줘도 실제로는 STARTTLS 로 붙는다
          #   (.NET 은 암시적 SSL 을 지원하지 않는다). 우리 Java 설정은 465를 암시적 SSL 로 본다.
          #   서버가 STARTTLS 만 받으면 'Unsupported or unrecognized SSL message' 가 난다 —
          #   그때는 MAIL_SSL=false · MAIL_STARTTLS=true 두 변수만 바꾸면 된다(코드 수정 없음).
          MAIL_STARTTLS: ${{ vars.MAIL_STARTTLS || 'false' }}
          # ‼️평소에는 **넣지 않는다**(빈 값). 메일 서버가 중간 인증서를 안 보내는 문제는
          #   이미지에 그 중간 CA 를 주입해 해결했다(Dockerfile · config/certs).
          #   이 변수는 인증서 검증을 통째로 건너뛰는 마지막 수단이라, 켜면 레거시보다 약해진다.
          MAIL_SSL_TRUST: ${{ vars.MAIL_SSL_TRUST }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          AWS_REGION: ${{ env.AWS_REGION }}
          # 특약점 사이트(order.dsdo.co.kr) 서버 간 연동 — 10/26 명세 §10-3. ‼️기본값 없음 —
          # 비어 있으면 /api/v1/dealer-site/** 전부 401(DealerSiteProperties.enabled()).
          # 기동을 막는 필수값은 아니다(DB_HOST 등과 달리 missing= 선검사에 넣지 않는다) —
          # 이 기능 자체가 아직 켜지기 전이라도 나머지 배포는 그대로 성공해야 한다.
          DEALER_SITE_API_KEY: ${{ secrets.DEALER_SITE_API_KEY }}
          DEALER_SITE_WAREHOUSE_CODE: ${{ vars.DEALER_SITE_WAREHOUSE_CODE }}

      # 배포가 "컨테이너는 떴는데 DB 못 붙음" 상태로 조용히 성공 처리되는 것을 막는다.
      # (2026-08-01 장애가 며칠간 안 잡힌 이유 = 기동 검증이 없었음)
      - name: 기동 검증 (health)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for i in $(seq 1 30); do
              body=$(curl -s -m 10 http://localhost:8080/actuator/health || true)
              case "$body" in
                *'"status":"UP"'*) echo "health OK: $body"; exit 0 ;;
              esac
              echo "waiting for health... ($i/30) $body"
              sleep 10
            done
            echo "!! 기동 검증 실패 — 컨테이너 로그:"
            docker logs --tail 100 dsales
            exit 1
