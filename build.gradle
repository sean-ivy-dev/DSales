plugins {
	id 'java'
	// ★3.4.5 → 3.4.13: **같은 패치 라인**이라 API 변화가 없고, BOM 이 묶고 있는
	//   tomcat·spring-framework·spring-security·jackson·netty·logback 이 한꺼번에 올라간다.
	//   (2026-11-19 보안 점검: 그 묶음에서만 CRITICAL 33건이 나왔다. 마이너 상향(3.5.x)은
	//    12/11 이관 뒤로 미루고, 지금은 패치만 올린다 — 실사용 직전이라 변화를 최소로 둔다.)
	id 'org.springframework.boot' version '3.4.13'
	id 'io.spring.dependency-management' version '1.1.7'
	// 정적분석(P0-07 / 검수 S-7 "정적분석 SQLi 0건"). SpotBugs + FindSecBugs 보안 룰.
	id 'com.github.spotbugs' version '6.0.26'
	// 테스트 커버리지 측정. 검증 '건수'만으로는 "코드의 얼마를 덮었나"에 답할 수 없다.
	id 'jacoco'
}

group = 'com.daesung'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// QueryDSL Q-클래스 생성 위치
def generatedDir = "$buildDir/generated/sources/annotationProcessor/java/main"

repositories {
	mavenCentral()
}

ext {
	querydslVersion = '5.1.0'
	// ★5.3.0 → 5.4.1: OOXML 입력 검증(CVE-2025-31672).
	poiVersion = '5.4.1'
	// ★2.7.0 → 2.10.0: 품고 있는 swagger-ui 가 5.18.2 라 DOMPurify XSS 권고 23건이 딸려 온다.
	springdocVersion = '2.10.0'
	// ★2.6.0 → 2.6.8: Aurora 권한 상승(GHSA-7xw4-g7mm-r4hh, 2.6.5 에서 수정).
	awsJdbcWrapperVersion = '2.6.8'
	findSecBugsVersion = '1.13.0'
	awsSdkVersion = '2.46.7'
	// Docker Engine 29.x(min API 1.40) 대응 — Boot 3.4.5 기본 TC(1.20.6)의 docker-java가 구 API로 핑해 실패.
	set('testcontainers.version', '1.21.3')

	// ★★Boot BOM 이 안 묶거나 낮게 묶는 것만 **개별로 올린다**(2026-11-19 보안 점검).
	//   BOM 이 묶는 것(tomcat·spring-\*·jackson·netty·logback)은 **손대지 않는다** —
	//   따로 올리면 BOM 이 맞춰 둔 조합이 깨진다. Boot 패치 상향으로 같이 올라간다.
	set('mysql.version', '9.7.0')            // CVE-2025-30706 (9.1.0 영향)
	set('httpclient5.version', '5.6.5')      // CVE-2026-71290 TLS 호스트명 검증 미비(CVSS 9.1)
	set('httpcore5.version', '5.5')          // CVE-2026-54399/54428 헤더 파싱 메모리 고갈
	set('angus-mail.version', '2.0.5')       // CVE-2025-7962 SMTP 인젝션
	set('commons-lang3.version', '3.18.0')   // CVE-2025-48924 무한 재귀(3.17.0 영향)

	// ★★BOM 이 묶는 것도 **같은 패치 라인 안에서만** 더 올린다(2026-11-19 보안 점검 2차).
	//   Boot 3.4.13 이 데려오는 버전이 아직 낡아 CRITICAL 이 남는다.
	//   ‼️마이너(6.2→6.3, 10.1→11.0)는 올리지 않는다 — API 가 바뀐다.
	//     패치 안에서만 올리므로 호환이 유지되고, 통합테스트 1,082건이 그것을 확인한다.
	set('spring-framework.version', '6.2.19')  // spring-core/webmvc/expression CRITICAL 다수
	set('tomcat.version', '10.1.62')           // 인증 우회·접근제어(CVSS 9.8) — 10.1.58 에서 수정
	set('netty.version', '4.1.141.Final')      // SNI 라우팅 우회·TLS 호스트명 검증(CVSS 10.0)
	set('jackson-bom.version', '2.18.12')      // 다형성 타입 우회·ReDoS
	set('log4j2.version', '2.26.1')            // 비유한 부동소수 인코딩
}

dependencies {
	// --- Web / API ---
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// --- Persistence (JPA + QueryDSL + MySQL 8) ---
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// --- DB 자격증명을 Secrets Manager에서 (aws 프로파일 전용) ---
	// AWS Advanced JDBC Wrapper의 awsSecretsManager 플러그인: 커넥션 생성 시마다 시크릿의 계정/비번을 사용하고,
	// 인증 실패 시 캐시를 버리고 시크릿을 재조회해 1회 재시도 → RDS 관리형 자격증명 자동 로테이션 중에도 앱이 안 죽는다.
	// (로컬/테스트는 default 프로파일 = 순정 mysql-connector-j 경로 그대로. application-aws.yml에서만 드라이버 교체)
	runtimeOnly "software.amazon.jdbc:aws-advanced-jdbc-wrapper:${awsJdbcWrapperVersion}"
	runtimeOnly platform("software.amazon.awssdk:bom:${awsSdkVersion}")
	runtimeOnly 'software.amazon.awssdk:secretsmanager'
	implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
	annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// --- Schema migration (신규 스키마 대량 → 초반부터 이력관리) ---
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// --- Security / RBAC ---
	// 메일 발송(9/27 항목 17·A-4 — 통합매출조회·외상매출장조회 이메일 전송).
	// 레거시(Common.vb:SendMail)가 하던 일을 그대로 옮긴다.
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// --- Redis (refresh 토큰 저장·TTL 자동만료. 캐시 확장 여지) ---
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// --- Excel (홈택스 양식·명세서·RAW export) ---
	implementation "org.apache.poi:poi-ooxml:${poiVersion}"

	// --- API 문서 (OpenAPI 계약, Phase1) ---
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// --- 편의 ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// --- DSRE2(MariaDB) 접속: 위 mysql-connector-j 공용 사용(주 DB도 MySQL8) ---
	// runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'  // DSLab / DSTxtBook (SQL Server) — 필요 시

	// --- Test (트랜잭션 원자성·동시성은 실제 DB로 검증) ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// QueryDSL 생성 소스 디렉토리 등록
sourceSets {
	main {
		java {
			srcDir generatedDir
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// 로컬 Docker Desktop(macOS) 소켓을 Testcontainers에 전달. CI/타 환경은 환경변수 우선.
	def dockerHost = System.getenv('DOCKER_HOST')
	if (dockerHost) {
		environment 'DOCKER_HOST', dockerHost
	} else if (file("${System.getProperty('user.home')}/.docker/run/docker.sock").exists()) {
		environment 'DOCKER_HOST', "unix://${System.getProperty('user.home')}/.docker/run/docker.sock"
	}
	environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
	// Docker Engine 29.x는 min API 1.40 — docker-java 기본값(1.32)이 낮아 400. env·시스템프로퍼티 양쪽 주입.
	def apiVer = System.getenv('DOCKER_API_VERSION') ?: '1.44'
	environment 'DOCKER_API_VERSION', apiVer
	systemProperty 'api.version', apiVer          // docker-java Properties 키
}

// ── 테스트 커버리지 ────────────────────────────────────────────────────────
// 측정 대상에서 빼는 것들: 실행 코드가 아니거나(설정·DTO·엔티티 접근자),
// 테스트 환경에서 아예 꺼져 있어(DSRE 연동) 0으로 잡히면 수치를 왜곡하는 구간.
// ‼️제외는 "안 덮은 것을 숨기는 용도"가 아니라 "분모를 정직하게 만드는 용도"다 —
//   서비스·컨트롤러·리포지토리 같은 실제 로직은 하나도 빼지 않는다.
jacoco {
	toolVersion = '0.8.12'
}

def coverageExcludes = [
		'com/daesung/sales/**/dto/**',        // 값 객체(record) — 접근자뿐
		'com/daesung/sales/config/**',        // 스프링 설정
		'com/daesung/sales/**/entity/**Q*',   // QueryDSL 생성 클래스
		'com/daesung/sales/SalesApplication*'
]

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: coverageExcludes)
	}))
}

clean {
	delete file(generatedDir)
}

// ── 정적분석 (P0-07 / 검수 S-7) ────────────────────────────────────────────
// 근거: 검수 통과 기준 "정적분석 SQLi 0건" — 검사할 도구 자체가 없었다.
// SpotBugs 본체 + FindSecBugs 플러그인(SQL 인젝션·하드코딩 비밀·경로조작 등 보안 룰).
dependencies {
	spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:${findSecBugsVersion}"
}

spotbugs {
	toolVersion = '4.8.6'
	effort = com.github.spotbugs.snom.Effort.valueOf('MAX')  // 보안 룰은 최대 분석에서 잘 잡힌다
	reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW') // 낮은 확신도까지 = 놓치는 것보다 낫다
	excludeFilter = file('config/spotbugs-exclude.xml')
	// 테스트 코드는 대상에서 제외(운영 코드만 본다)
	ignoreFailures = false
}

// 테스트 소스는 검사하지 않는다 — 픽스처의 문자열 조립까지 잡으면 노이즈만 커진다.
tasks.named('spotbugsTest') { enabled = false }

tasks.named('spotbugsMain') {
	reports {
		html { required = true; outputLocation = file("$buildDir/reports/spotbugs/main.html") }
		xml { required = true }
	}
}
